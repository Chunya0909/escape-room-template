er":8,"stem":"Jamie's aunt _____ him her gloves.","options":["borrowed","lent","bought","ordered"],"answer":1,"evidence":["G2"],"explanation":"從 aunt 的角度是把手套借出去，所以使用 lent。","level":"A1-A2"},{"number":9,"stem":"Kate bought a jacket _____ Pat.","options":["to","from","for","of"],"answer":2,"evidence":["G4"],"explanation":"buy something for someone。","level":"A1-A2"},{"number":22,"stem":"Which sentence describes the aunt's action correctly?","options":["She borrowed Jamie her gloves.","She borrowed her gloves from Jamie.","She lent Jamie her gloves.","She lent her gloves from Jamie."],"answer":2,"evidence":["G2"],"explanation":"lend someone something 表示把東西借給某人。","level":"A2-B1"},{"number":23,"stem":"Which sentence means the same as “My parents gave me the jacket”?","options":["My parents gave the jacket for me.","My parents gave the jacket to me.","My parents gave me to the jacket.","My parents gave the jacket of me."],"answer":1,"evidence":["G3","G7"],"explanation":"give + person + thing = give + thing + to + person。","level":"A2-B1"},{"number":24,"stem":"Which sentence is correct?","options":["I wrote Zac it.","I wrote him it.","I wrote it to Zac.","I wrote it Zac."],"answer":2,"evidence":["G7"],"explanation":"直接受詞為代名詞 it 時，應放在間接受詞前：I wrote it to Zac。","level":"B1"}],"map":[[3,8,1,6],[0,5,9,2],[7,4,6,1],[8,2,5,0]],"code":"3810","position":6,"pick":1,"salt":7},{"title":"The Strange Message","zh":"奇怪的澳洲英文","level":"A1–B1","mission":"Decode the Australian English in Jamie's postcard using context clues.","source":"課本 pp.11–12 Reading","clues":[{"id":"A1","text":"A man said “go die” to Jamie, but in fact, he meant “good day.”（課本 p.11）"},{"id":"A2","text":"Jamie ordered cookies and hot chocolate because the weather was cold.（課本 p.11）"},{"id":"A3","text":"The clerk said, “Bikkies and hot chokkie, your order is coming right up.”（課本 p.11）"},{"id":"A4","text":"課本 After You Read：Jamie mainly talks about Australian English.（課本 p.12）"},{"id":"A5","text":"Reading Clue：in fact 用來補充或修正前面的理解。"}],"questions":[{"number":10,"stem":"What did Jamie order at the coffee shop?","options":["Tea and cake.","Cookies and hot chocolate.","Coffee and bread.","Chicken and juice."],"answer":1,"evidence":["A2"],"explanation":"Jamie 直接說 I ordered cookies and hot chocolate。","level":"A1"},{"number":11,"stem":"What are “bikkies and hot chokkie”?","options":["Cookies and hot chocolate.","Bread and coffee.","Chicken and tea.","Candy and milk."],"answer":0,"evidence":["A2","A3"],"explanation":"前一句的 order 與後一句店員的說法對應，可推知兩者指同樣的食物。","level":"A1-A2"},{"number":12,"stem":"What did the man actually mean by “go die”?","options":["Good day.","Go home.","Good night.","Go away."],"answer":0,"evidence":["A1"],"explanation":"課文明確說 he meant “good day.”","level":"A1-A2"},{"number":25,"stem":"Why was Jamie mad when a man said “go die”?","options":["Jamie thought the man was being unfriendly.","Jamie didn't like Australian food.","The man took Jamie's postcard.","Jamie wanted to go home."],"answer":0,"evidence":["A1"],"explanation":"Jamie 起初把聲音理解成 go die，因此以為對方在說不友善的話。","level":"A2-B1"},{"number":26,"stem":"What does “in fact” do in this part of the postcard?","options":["It gives another example.","It corrects Jamie's first understanding.","It tells when the event happened.","It introduces the receiver."],"answer":1,"evidence":["A1","A5"],"explanation":"in fact 引出真正情況，修正 Jamie 一開始的理解。","level":"A2-B1"},{"number":27,"stem":"How can Jamie understand that “bikkies” means cookies?","options":["The clerk explains it in Chinese.","Jamie checks a dictionary.","Jamie ordered cookies before the clerk said bikkies.","Zac tells him later."],"answer":2,"evidence":["A2","A3"],"explanation":"前文的 order 提供 context clue，因此可以由上下文推論 bikkies。","level":"A2-B1"}],"map":[[6,1,8,3],[9,2,4,7],[0,5,3,8],[4,7,1,9]],"code":"6189","position":3,"pick":4,"salt":2},{"title":"The Lost Postcard","zh":"遺失的明信片","level":"A1–B1","mission":"Rebuild the postcard and read the Cairns climate chart to unlock the final route.","source":"課本 pp.11–13, 17–18","clues":[{"id":"P1","text":"Postcard body: Jamie shares two surprising Australian English experiences.（課本 pp.11–13）"},{"id":"P2","text":"Your friend, Jamie → closing + signature（課本 p.13）"},{"id":"P3","text":"Zac Hugo / No. 30, Yuren Rd. / Taipei 11249 / Taiwan (ROC) → recipient + address（課本 p.13）"},{"id":"C1","text":"Cairns: every month is above 18°C; dry season <60 mm; rainy season >60 mm.（課本 p.17）"},{"id":"C2","text":"Chart: rainfall from June to October is below 60 mm, so these months form the dry season.（課本 pp.17–18）"},{"id":"C3","text":"Pingtung's climate is similar to Cairns, but its rainy season starts in April.（課本 p.18）"}],"questions":[{"number":13,"stem":"Which part of the postcard tells us who wrote it?","options":["Dear Zac,","Your friend, Jamie","No. 30, Yuren Rd.","Taiwan (ROC)"],"answer":1,"evidence":["P2"],"explanation":"Jamie 是寄件人的 signature。","level":"A1-A2"},{"number":14,"stem":"Who is the recipient of the postcard?","options":["Jamie","Zac Hugo","The clerk","Jamie's aunt"],"answer":1,"evidence":["P3"],"explanation":"收件人欄寫的是 Zac Hugo。","level":"A1-A2"},{"number":15,"stem":"Which months are in Cairns's dry season?","options":["January to March","June to October","November to January","March to May"],"answer":1,"evidence":["C1","C2"],"explanation":"乾季定義為 rainfall < 60 mm，圖表顯示 June–October 符合。","level":"A2"},{"number":28,"stem":"What is the main purpose of Jamie's postcard?","options":["To complain about Australian weather.","To explain how to order food.","To share surprising experiences with Australian English.","To teach Zac how to write a postcard."],"answer":2,"evidence":["P1"],"explanation":"兩個主要事件都圍繞 Australian English，因此主旨是分享這些有趣經驗。","level":"A2-B1"},{"number":29,"stem":"Which statement about Cairns is supported by the chart?","options":["Winter temperatures usually fall below 0°C.","Cairns has almost no temperature change during the year.","June to October is the dry season.","December is the coldest month."],"answer":2,"evidence":["C1","C2"],"explanation":"依 dry season < 60 mm 的定義，June–October 是乾季。","level":"A2-B1"},{"number":30,"stem":"Pingtung's rainy season starts in April. Which rainfall pattern should we expect?","options":["Rainfall rises around April and stays high through warmer months.","Heavy rainfall begins only in November.","There is almost no rain all year.","The highest rainfall occurs only in winter."],"answer":0,"evidence":["C3"],"explanation":"題目要求把 rainy season starts in April 轉成圖表趨勢，因此 April 左右雨量應開始明顯上升。","level":"B1"}],"map":[[7,0,4,9],[2,6,1,8],[5,3,9,4],[1,8,6,0]],"code":"7040","position":7,"pick":2,"salt":6}]};

function chooseQueue(){
 const bank=flatBank();
 const levelKey=state.level==='beginner'?'beginner':'advanced';
 // Prefer lesson-defined coherent 5/10/15 sets; fall back to the legacy spread-randomizer for older lessons.
 if(SOURCE_DATA.sets && SOURCE_DATA.sets[levelKey] && SOURCE_DATA.sets[levelKey][String(state.length)]){
   const wanted=SOURCE_DATA.sets[levelKey][String(state.length)];
   const byNumber=new Map(bank.map(q=>[q.number,q]));
   return wanted.map(n=>byNumber.get(n)).filter(Boolean);
 }
 let ok;
 if(state.level==='beginner')ok=bank.filter(q=>['A1','A1-A2','A2'].includes(q.level));
 else ok=bank.filter(q=>['A2','A2-B1','B1'].includes(q.level));
 const byRoom={};ok.forEach(q=>(byRoom[q.roomIndex]??=[]).push(q));
 Object.values(byRoom).forEach(a=>a.sort(()=>Math.random()-.5));
 const rooms=Object.keys(byRoom).sort(()=>Math.random()-.5),picked=[];
 let round=0;

 return picked;
}
function home(){shell(`<section class="panel home"><p class="kicker">GRADE 8 · ENGLISH ESCAPE ROOM</p><h1>The Lost Postcard<br><span>from Australia</span></h1><p class="lead">Jamie 從 Australia 寄出的明信片遺失了部分訊息。使用 <b>Answer + Evidence</b> 修復 Weather、Travel Log、Dative Verbs、Australian English 與 Climate clues。可選程度、題數與提示模式。</p><div class="grid3"><section class="setting"><h3>① Language Level</h3><div class="choice-stack"><button class="pick" data-level="beginner" aria-pressed="${state.level==='beginner'}">🌱 Beginner<small>A1–A2 · 基礎理解、字彙、文法</small></button><button class="pick" data-level="advanced" aria-pressed="${state.level==='advanced'}">🔥 Advanced<small>A2–B1 · 推論、主旨、語意</small></button></div></section><section class="setting"><h3>② Mission Length</h3><div class="choice-stack">${[5,10,15].map(n=>`<button class="pick" data-length="${n}" aria-pressed="${state.length===n}">${n} Questions<small>${n===5?'Quick · 約 8–10 分':n===10?'Standard · 約 15–20 分':'Full · 約 25–30 分'}</small></button>`).join('')}</div></section><section class="setting"><h3>③ Support Mode</h3><div class="choice-stack"><button class="pick" data-mode="guide" aria-pressed="${state.mode==='guide'}">🧭 Guided<small>線索自動展開</small></button><button class="pick" data-mode="challenge" aria-pressed="${state.mode==='challenge'}">🕵️ Challenge<small>自行打開線索</small></button></div></section></div><label class="label" for="team">小隊名稱／姓名（證書使用）</label><input class="team" id="team" maxlength="30" placeholder="例如：第 3 組 Game Makers" value="${esc(state.team)}"><div class="summary-strip"><span>Answer + Evidence</span><span>Progressive Hints</span><span>${Math.ceil(state.length/5)} Room${state.length>5?'s':''}</span><span>可列印證書</span></div><button class="start" id="start">START THE MISSION →</button></section>`);
 document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.team=$('#team').value;state.level=b.dataset.level;home()});document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{state.team=$('#team').value;state.length=+b.dataset.length;home()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.team=$('#team').value;state.mode=b.dataset.mode;home()});$('#start').onclick=()=>{state.team=$('#team').value.trim()||'Game Recovery Team';state.queue=chooseQueue();state.index=0;state.solved=[];state.digits=[];state.roomFragments=[];state.revisions=0;state.started=Date.now();state.screen='q';question()}}
function status(){const total=state.queue.length,done=state.solved.length,rooms=Math.ceil(total/5),room=Math.floor(state.index/5)+1;return `<div class="status"><span class="pill">ROOM ${Math.min(room,rooms)} / ${rooms}</span><div class="meter"><div style="width:${done/total*100}%"></div></div><span class="count">${done} / ${total}</span></div><div class="frags">${Array.from({length:rooms},(_,i)=>`<span class="frag ${state.roomFragments[i]!==undefined?'done':''}">${state.roomFragments[i]!==undefined?state.roomFragments[i]:'?'}</span>`).join('')}</div>`}
function current(){return state.queue[state.index]}
function qDigit(q){return (q.number*3+q.answer+7)%10}
function question(){state.selected=null;state.evidence=[];state.questionWrong=0;const q=current();const roomNo=Math.floor(state.index/5)+1;const inRoom=state.index%5+1;shell(`<section class="panel">${status()}<div class="room-title"><div><p class="kicker">${esc(q.level)} · ${esc(q.roomTitle)}</p><h2>Room ${roomNo} · ${esc(q.roomZh)}</h2></div><span class="muted">本關第 ${inRoom} / ${Math.min(5,state.queue.length-(roomNo-1)*5)} 題</span></div><div class="story">${esc(q.mission)}</div><div class="play"><section><p class="kicker">QUESTION ${state.index+1}</p><h3>${esc(q.stem)}</h3><div class="answers">${q.options.map((o,i)=>`<button class="answer" data-a="${i}" aria-pressed="false"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><button class="primary" id="check" disabled>檢查答案與依據</button><button class="secondary" id="hint">提示</button></div><div id="hintbox"></div><div id="feedback" class="feedback"></div></section><aside><details class="source" ${state.mode==='guide'?'open':''}><summary>閱讀線索 · 選 ${q.evidence.length} 項依據</summary><p class="muted" style="font-size:14px">${esc(q.source)} · 找出最能支持答案的文本證據。</p>${q.clues.map(c=>`<button class="evidence" data-e="${c.id}" aria-pressed="false"><span class="eid">${c.id}</span>${esc(c.text)}</button>`).join('')}</details></aside></div></section>`);
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));updateCheck()});document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const id=b.dataset.e;state.evidence=state.evidence.includes(id)?state.evidence.filter(x=>x!==id):[...state.evidence,id];document.querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',String(state.evidence.includes(x.dataset.e))));updateCheck()});$('#check').onclick=check;$('#hint').onclick=manualHint}
function updateCheck(){const q=current();$('#check').disabled=state.selected===null||state.evidence.length!==q.evidence.length}
function manualHint(){const q=current();const box=$('#hintbox');const n=state.questionWrong;if(n===0)box.innerHTML=`<div class="hintbox"><b>Hint 1</b>：先找題目中的人物、時間詞或重複關鍵字，再回線索比對。</div>`;else if(n===1)box.innerHTML=`<div class="hintbox"><b>Hint 2</b>：把注意力放在「${q.evidence.join('、')}」附近的線索。</div>`;else{box.innerHTML=`<div class="hintbox"><b>Hint 3</b>：正確依據已標黃，先用它排除不合理選項。</div>`;document.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('target',q.evidence.includes(x.dataset.e)));$('details').open=true}}
function check(){const q=current();const ev=state.evidence.length===q.evidence.length&&q.evidence.every(x=>state.evidence.includes(x));if(state.selected!==q.answer||!ev){state.revisions++;state.questionWrong++;beep(false);$('#feedback').className='feedback error';$('#feedback').innerHTML=`<strong>還沒解鎖。</strong> ${state.questionWrong===1?'重新比對題目與文本證據。':state.questionWrong===2?'再試一次；提示會縮小範圍。':'使用 Hint 3，先從標示線索重新判讀。'}`;manualHint();return}
 const d=qDigit(q);state.solved.push(q.number);state.digits.push(d);beep(true);document.querySelectorAll('[data-a],[data-e]').forEach(b=>b.disabled=true);$('#check').disabled=true;$('#hint').disabled=true;$('#feedback').className='feedback';$('#feedback').innerHTML=`<strong>✓ Correct! Answer + Evidence 都吻合。</strong>${esc(q.explanation)}<br>本題 Code Digit：<span class="digit">${d}</span><div class="actions"><button class="primary" id="next">${((state.index+1)%5===0||state.index===state.queue.length-1)?'前往 Room Lock →':'下一題 →'}</button></div>`;$('#next').onclick=()=>{if((state.index+1)%5===0||state.index===state.queue.length-1)roomLock();else{state.index++;question()}}}
function roomSlice(){const start=Math.floor(state.index/5)*5;return state.digits.slice(start,state.index+1)}
function roomLock(){const digits=roomSlice();const expected=digits.join('');const roomNo=Math.floor(state.index/5)+1;shell(`<section class="panel room-lock">${status()}<p class="kicker">ROOM ${roomNo} · CODE LOCK</p><h2>把本關取得的 Code Digits 依序輸入</h2><div class="code-row">${digits.map(()=>'<span class="code-chip">?</span>').join('')}</div><p class="muted">依本關題目出現順序輸入，不相加、不重排。</p><input class="lockinput" id="roomcode" inputmode="numeric" maxlength="${digits.length}" placeholder="${'0'.repeat(digits.length)}"><div class="actions" style="justify-content:center"><button class="primary" id="unlock">UNLOCK ROOM →</button></div><div id="feedback" class="feedback"></div></section>`);$('#unlock').onclick=()=>{if($('#roomcode').value!==expected){beep(false);$('#feedback').className='feedback error';$('#feedback').textContent='密碼不符。回想每題答對時得到的 Code Digit，依順序輸入。';return}const frag=(digits.reduce((a,b)=>a+b,0)+roomNo*3)%10;state.roomFragments.push(frag);beep(true);roomWon(roomNo,frag)}}
function roomWon(roomNo,frag){const last=state.index===state.queue.length-1;shell(`<section class="panel success">${status()}<p class="kicker">ROOM RESTORED</p><h2>Room ${roomNo} 修復成功！</h2><p>你取得最終修復碎片：</p><div class="code-row"><span class="code-chip">${frag}</span></div><p class="muted">Room Fragment 只用於最後的 Final Lock。</p><button class="primary" id="continue">${last?(state.roomFragments.length===1?'完成任務 →':'前往 FINAL LOCK →'):'進入下一個 Room →'}</button></section>`);$('#continue').onclick=()=>{if(last){if(state.roomFragments.length===1)win();else finalLock()}else{state.index++;question()}}}
function finalLock(){const expected=state.roomFragments.join('');shell(`<section class="panel room-lock"><p class="kicker">FINAL LOCK</p><h2>組合所有 Room Fragments</h2><p>依 Room 1 → Room ${state.roomFragments.length} 的順序輸入。</p><div class="code-row">${state.roomFragments.map(()=>'<span class="code-chip">?</span>').join('')}</div><input class="lockinput" id="finalcode" inputmode="numeric" maxlength="${state.roomFragments.length}" placeholder="${'0'.repeat(state.roomFragments.length)}"><div class="actions" style="justify-content:center"><button class="primary" id="final">RESTORE THE GAME →</button></div><div id="feedback" class="feedback"></div></section>`);$('#final').onclick=()=>{if($('#finalcode').value!==expected){beep(false);$('#feedback').className='feedback error';$('#feedback').textContent='Final Code 還沒吻合。確認 Room Fragment 的順序。';return}win()}}
function win(){state.ended=Date.now();beep(true);const sec=Math.floor((state.ended-state.started)/1000),time=`${Math.floor(sec/60)} 分 ${sec%60} 秒`;shell(`<section class="panel success"><div class="no-print"><p class="kicker">MISSION COMPLETE</p><h1>Game restored!</h1><p>你用答案與文本證據完成了任務。</p></div><div class="certificate"><p class="kicker">CERTIFICATE OF COMPLETION</p><h2>The Lost Postcard from Australia V3</h2><p style="font-size:28px;font-weight:800">${esc(state.team)}</p><p>${state.level==='beginner'?'Beginner A1–A2':'Advanced A2–B1'} · ${state.queue.length} Questions · ${state.mode==='guide'?'Guided':'Challenge'}</p><p>${new Date(state.ended).toLocaleDateString('zh-TW')}</p></div><div class="metrics"><span><strong>${state.solved.length}/${state.queue.length}</strong>完成題數</span><span><strong>${state.revisions}</strong>再思考次數</span><span><strong>${time}</strong>探索時間</span></div><div class="actions no-print" style="justify-content:center"><button class="primary" id="print">列印／另存 PDF 證書</button><button class="secondary" id="again">再挑戰一次</button></div><p class="muted no-print">Reflection：哪一段英文 evidence 最幫助你修正原本的答案？</p></section>`);$('#print').onclick=()=>window.print();$('#again').onclick=()=>restart(true)}
function restart(force=false){if(!force&&state.screen!=='home'&&state.queue.length&& !confirm('確定重新開始？目前進度會清除。'))return;const sound=state.sound,level=state.level,length=state.length,mode=state.mode;state={screen:'home',level,length,mode,team:'',queue:[],index:0,selected:null,evidence:[],solved:[],digits:[],roomFragments:[],wrong:0,revisions:0,started:0,ended:0,sound,questionWrong:0};home()}
$('#reset').onclick=()=>restart(false);$('#sound').onclick=()=>{state.sound=!state.sound;$('#sound').textContent='音效：'+(state.sound?'開':'關');if(state.sound)beep(true)};home();
</script>
</body></html>

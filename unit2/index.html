,{"number":11,"stem":"Amy isn’t home. Which sentence is the best?","options":["Please call back later.","The choice is yours.","Are you pulling my leg?","Please sign up."],"answer":0,"evidence":["P3"],"explanation":"對方不在家，請稍後回電：Please call back later."},{"number":12,"stem":"Which is correct when you answer the phone?","options":["I am Amy speaking.","This is Amy speaking.","That is Amy speaking.","Amy is me speaking."],"answer":1,"evidence":["P4"],"explanation":"電話中用 This is ... speaking. 表明自己是誰。"}],"map":[[0,9,8,7],[4,8,6,5],[0,8,1,9],[5,9,6,0]],"code":"9409","position":8,"pick":1,"salt":8},{"title":"The Time Machine","zh":"校正時間機器","level":"A2","mission":"Repair the timeline. Check what happens first.","source":"課本 pp.26-28；講義 pp.20-21","clues":[{"id":"T1","text":"Alan: get up → make the bed.（先起床，再整理床鋪；依課本 p.26 情境）"},{"id":"T2","text":"Mollie: practice the violin → have lunch.（先練小提琴，再吃午餐；依課本 p.27 情境）"},{"id":"T3","text":"Dylan: be at the airport + call his parents.（打電話發生在機場的同一情境；課本 p.28）"},{"id":"T4","text":"時間從屬子句放句首時，與主要子句之間加逗號。例：When I got home, my mom was busy in the kitchen.（講義文法規則）"}],"questions":[{"number":13,"stem":"______ Alan got up, he made the bed.","options":["After","Before","Whose","Because"],"answer":0,"evidence":["T1"],"explanation":"Alan 先起床，之後整理床鋪，因此使用 After。"},{"number":14,"stem":"Mollie practiced the violin ______ she had lunch.","options":["after","before","whose","mine"],"answer":1,"evidence":["T2"],"explanation":"依 T2 情境，練琴在午餐之前，所以用 before。沒有情境時，after 也可能合文法。"},{"number":15,"stem":"______ Dylan was at the airport, he called his parents.","options":["When","Mine","Before of","After of"],"answer":0,"evidence":["T3"],"explanation":"Dylan 在機場時打電話，When 表達當時的情境。"},{"number":16,"stem":"Choose the sentence with the correct punctuation.","options":["After Megan did her homework she studied Chinese.","After Megan did her homework, she studied Chinese.","After, Megan did her homework she studied Chinese.","Megan after did her homework, she studied Chinese."],"answer":1,"evidence":["T4"],"explanation":"句首的 After 子句結束後加逗號，再接主要子句。"}],"map":[[0,1,7,2],[9,5,2,7],[1,6,8,7],[7,0,8,6]],"code":"0510","position":1,"pick":3,"salt":4},{"title":"Whose Things Are These?","zh":"物品歸還任務","level":"A2","mission":"Return the lost things to their owners.","source":"課本 p.29；講義 pp.22-23","clues":[{"id":"G1","text":"所有格代名詞可以代替「所有格＋名詞」。my sandwich → mine；不再重複 sandwich。"},{"id":"G2","text":"對方問 your ruler；自己回答時，所指的是 my ruler。所有格後面接名詞；所有格代名詞可單獨代替整個名詞片語。"},{"id":"G3","text":"the boys 是複數物主。their basketballs 可用所有格代名詞代替；完整物品名詞已出現，就不必重複。"},{"id":"G4","text":"Whose 問某物屬於誰；Who 問人是誰；Who’s 是 Who is 的縮寫。"}],"questions":[{"number":17,"stem":"This sandwich is my sandwich. → This sandwich is ______.","options":["my","mine","me","I"],"answer":1,"evidence":["G1"],"explanation":"mine 代替 my sandwich，避免重複名詞。"},{"number":18,"stem":"“Is this your ruler?” “Yes, it’s ______.”","options":["my","me","mine","I"],"answer":2,"evidence":["G2"],"explanation":"自己回答時指 my ruler，用 mine 代替。"},{"number":19,"stem":"These basketballs belong to the boys. They are ______.","options":["their","theirs","them","they"],"answer":1,"evidence":["G3"],"explanation":"the boys 是複數物主；theirs 代替 their basketballs。"},{"number":20,"stem":"“______ bag is this?” “It’s Karen’s.”","options":["Who","Who’s","Whose","What"],"answer":2,"evidence":["G4"],"explanation":"Whose 詢問物主；回答 Karen’s 表示是 Karen 的。"}],"map":[[3,8,1,2],[0,8,7,1],[2,9,1,8],[9,6,8,4]],"code":"8798","position":6,"pick":2,"salt":6},{"title":"The Secret Advertisement","zh":"解讀神秘廣告","level":"A2","mission":"Read the ad. Find the teachers and lessons.","source":"課本 p.31 Reading","clues":[{"id":"A1","text":"Our teacher, Ms. Jobs, is a four-time winner of the Taiwan Video Game Contest."},{"id":"A2","text":"Also, we have two guest teachers."},{"id":"A3","text":"They’re game engineers from a famous video game company. You can learn a lot from them."},{"id":"A4","text":"You can design your own video games after you finish the lessons."}],"questions":[{"number":21,"stem":"Who is Ms. Jobs?","options":["A student","A game engineer","A teacher and contest winner","A soccer player"],"answer":2,"evidence":["A1"],"explanation":"Ms. Jobs 是社團老師，也是四次比賽冠軍。"},{"number":22,"stem":"How many guest teachers does the club have?","options":["One","Two","Three","Four"],"answer":1,"evidence":["A2"],"explanation":"廣告寫的是 two guest teachers。"},{"number":23,"stem":"What are the guest teachers?","options":["Game engineers","PE teachers","Soccer players","Students"],"answer":0,"evidence":["A3"],"explanation":"They 指客座老師，他們是 game engineers。"},{"number":24,"stem":"What can students design after they finish the lessons?","options":["Robots","Cameras","Their own video games","School clubs"],"answer":2,"evidence":["A4"],"explanation":"完成課程後，可以設計自己的 video games。"}],"map":[[5,8,3,7],[3,9,6,7],[8,2,3,1],[0,5,2,9]],"code":"3982","position":3,"pick":1,"salt":9},{"title":"The London Ticket","zh":"尋找倫敦入場券","level":"A2-B1","mission":"Find the trip details and the starting date.","source":"課本 p.32 Reading","clues":[{"id":"L1","text":"Every year, we take two students on a trip to the London Game Festival for free."},{"id":"L2","text":"There, you can see many shows and play a lot of games."},{"id":"L3","text":"Our lessons start on September 10."},{"id":"L4","text":"Join now or miss out. The choice is yours!"}],"questions":[{"number":25,"stem":"Where can two students go?","options":["Taiwan Video Game Contest","London Game Festival","A water sports club","A computer store"],"answer":1,"evidence":["L1"],"explanation":"旅程目的地是 London Game Festival。"},{"number":26,"stem":"How many students can go on the trip every year?","options":["One","Two","Three","Four"],"answer":1,"evidence":["L1"],"explanation":"Every year ... two students：每年兩位。"},{"number":27,"stem":"How much do they need to pay for the trip?","options":["Nothing","$10","$100","The ad does not say."],"answer":0,"evidence":["L1"],"explanation":"for free 表示旅程免費；不代表所有課程都免費。"},{"number":28,"stem":"When do the lessons start?","options":["September 1","September 2","September 10","October 10"],"answer":2,"evidence":["L3"],"explanation":"開課日期是 September 10。"}],"map":[[3,0,7,8],[6,8,0,9],[1,9,6,4],[8,6,5,9]],"code":"0815","position":7,"pick":4,"salt":2},{"title":"The Final Game Code","zh":"重建遊戲密碼","level":"B1","mission":"Find how the ad invites students to join.","source":"課本 pp.31-32 Reading","clues":[{"id":"F1","text":"Our teacher, Ms. Jobs, is a four-time winner of the Taiwan Video Game Contest."},{"id":"F2","text":"Also, we have two guest teachers. They’re game engineers from a famous video game company."},{"id":"F3","text":"Our lessons are not difficult at all, and our teachers teach in a fun way."},{"id":"F4","text":"Join now or miss out. The choice is yours!"}],"questions":[{"number":29,"stem":"Why does the ad talk about Ms. Jobs and the two engineers?","options":["To show that the club has good teachers.","To teach students about London.","To sell cameras.","To teach swimming."],"answer":0,"evidence":["F1","F2"],"explanation":"Ms. Jobs 的獲獎經歷與工程師的專業背景，一起支持師資優良的推論。"},{"number":30,"stem":"“Our lessons are not difficult at all.” Which has the closest meaning?","options":["The lessons are very difficult.","The lessons are easy.","There are no lessons.","Students do not like the lessons."],"answer":1,"evidence":["F3"],"explanation":"not difficult at all 意思是一點也不難，也就是 easy。"},{"number":31,"stem":"“Join now or miss out.” What does “miss out” mean here?","options":["Win a game","Call someone","Lose a good chance","Make a choice"],"answer":2,"evidence":["F4"],"explanation":"Join now 的邀請語境表示：別失去這個好機會。"},{"number":32,"stem":"What is the main purpose of the whole ad?","options":["To tell the history of video games.","To ask students to join the Video Game Design Club.","To teach students how to play soccer.","To introduce London."],"answer":1,"evidence":["F3","F4"],"explanation":"簡單有趣的課程是吸引讀者的理由，Join now 是行動邀請；兩者支持「招募入社」的目的。"}],"map":[[3,7,4,6],[9,4,1,5],[9,5,1,8],[ const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function beep(good){if(!state.sound)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=good?660:230;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.21)}catch{}}

function flatBank(){const out=[];SOURCE_DATA.rooms.forEach((r,ri)=>r.questions.forEach((q,qi)=>out.push({...q,roomIndex:ri,roomTitle:r.title,roomZh:r.zh,level:r.level,mission:r.mission,source:r.source,clues:r.clues})));return out}
function chooseQueue(){const bank=flatBank();let ok;if(state.level==='beginner')ok=bank.filter(q=>['A1','A1-A2','A2'].includes(q.level));else ok=bank.filter(q=>['A2','A2-B1','B1'].includes(q.level));
 // Spread questions across source rooms before filling randomly.
 const byRoom={};ok.forEach(q=>(byRoom[q.roomIndex]??=[]).push(q));Object.values(byRoom).forEach(a=>a.sort(()=>Math.random()-.5));
 const rooms=Object.keys(byRoom).sort(()=>Math.random()-.5);const picked=[];let round=0;while(picked.length<state.length){let moved=false;for(const r of rooms){if(byRoom[r][round]&&picked.length<state.length){picked.push(byRoom[r][round]);moved=true}}if(!moved)break;round++}
 return picked;
}
function home(){shell(`<section class="panel home"><p class="kicker">GRADE 8 · ENGLISH ESCAPE ROOM</p><h1>The Missing<br><span>Game Code V3</span></h1><p class="lead">保留新版的 <b>Answer + Evidence</b> 閱讀任務，改成可選程度、題數與提示模式。每 5 題完成一個 Room，解開 Room Code 後取得修復碎片。</p><div class="grid3"><section class="setting"><h3>① Language Level</h3><div class="choice-stack"><button class="pick" data-level="beginner" aria-pressed="${state.level==='beginner'}">🌱 Beginner<small>A1–A2 · 基礎理解、字彙、文法</small></button><button class="pick" data-level="advanced" aria-pressed="${state.level==='advanced'}">🔥 Advanced<small>A2–B1 · 推論、主旨、語意</small></button></div></section><section class="setting"><h3>② Mission Length</h3><div class="choice-stack">${[5,10,15].map(n=>`<button class="pick" data-length="${n}" aria-pressed="${state.length===n}">${n} Questions<small>${n===5?'Quick · 約 8–10 分':n===10?'Standard · 約 15–20 分':'Full · 約 25–30 分'}</small></button>`).join('')}</div></section><section class="setting"><h3>③ Support Mode</h3><div class="choice-stack"><button class="pick" data-mode="guide" aria-pressed="${state.mode==='guide'}">🧭 Guided<small>線索自動展開</small></button><button class="pick" data-mode="challenge" aria-pressed="${state.mode==='challenge'}">🕵️ Challenge<small>自行打開線索</small></button></div></section></div><label class="label" for="team">小隊名稱／姓名（證書使用）</label><input class="team" id="team" maxlength="30" placeholder="例如：第 3 組 Game Makers" value="${esc(state.team)}"><div class="summary-strip"><span>Answer + Evidence</span><span>Progressive Hints</span><span>${Math.ceil(state.length/5)} Room${state.length>5?'s':''}</span><span>可列印證書</span></div><button class="start" id="start">START THE MISSION →</button></section>`);
 document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.team=$('#team').value;state.level=b.dataset.level;home()});document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{state.team=$('#team').value;state.length=+b.dataset.length;home()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.team=$('#team').value;state.mode=b.dataset.mode;home()});$('#start').onclick=()=>{state.team=$('#team').value.trim()||'Game Recovery Team';state.queue=chooseQueue();state.index=0;state.solved=[];state.digits=[];state.roomFragments=[];state.revisions=0;state.started=Date.now();state.screen='q';question()}}
function status(){const total=state.queue.length,done=state.solved.length,rooms=Math.ceil(total/5),room=Math.floor(state.index/5)+1;return `<div class="status"><span class="pill">ROOM ${Math.min(room,rooms)} / ${rooms}</span><div class="meter"><div style="width:${done/total*100}%"></div></div><span class="count">${done} / ${total}</span></div><div class="frags">${Array.from({length:rooms},(_,i)=>`<span class="frag ${state.roomFragments[i]!==undefined?'done':''}">${state.roomFragments[i]!==undefined?state.roomFragments[i]:'?'}</span>`).join('')}</div>`}
function current(){return state.queue[state.index]}
function qDigit(q){return (q.number*3+q.answer+7)%10}
function question(){state.selected=null;state.evidence=[];state.questionWrong=0;const q=current();const roomNo=Math.floor(state.index/5)+1;const inRoom=state.index%5+1;shell(`<section class="panel">${status()}<div class="room-title"><div><p class="kicker">${esc(q.level)} · ${esc(q.roomTitle)}</p><h2>Room ${roomNo} · ${esc(q.roomZh)}</h2></div><span class="muted">本關第 ${inRoom} / ${Math.min(5,state.queue.length-(roomNo-1)*5)} 題</span></div><div class="story">${esc(q.mission)}</div><div class="play"><section><p class="kicker">QUESTION ${state.index+1}</p><h3>${esc(q.stem)}</h3><div class="answers">${q.options.map((o,i)=>`<button class="answer" data-a="${i}" aria-pressed="false"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><button class="primary" id="check" disabled>檢查答案與依據</button><button class="secondary" id="hint">提示</button></div><div id="hintbox"></div><div id="feedback" class="feedback"></div></section><aside><details class="source" ${state.mode==='guide'?'open':''}><summary>閱讀線索 · 選 ${q.evidence.length} 項依據</summary><p class="muted" style="font-size:14px">${esc(q.source)} · 找出最能支持答案的文本證據。</p>${q.clues.map(c=>`<button class="evidence" data-e="${c.id}" aria-pressed="false"><span class="eid">${c.id}</span>${esc(c.text)}</button>`).join('')}</details></aside></div></section>`);
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));updateCheck()});document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const id=b.dataset.e;state.evidence=state.evidence.includes(id)?state.evidence.filter(x=>x!==id):[...state.evidence,id];document.querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',String(state.evidence.includes(x.dataset.e))));updateCheck()});$('#check').onclick=check;$('#hint').onclick=manualHint}
function updateCheck(){const q=current();$('#check').disabled=state.selected===null||state.evidence.length!==q.evidence.length}
function manualHint(){const q=current();const box=$('#hintbox');const n=state.questionWrong;if(n===0)box.innerHTML=`<div class="hintbox"><b>Hint 1</b>：先找題目中的人物、時間詞或重複關鍵字，再回線索比對。</div>`;else if(n===1)box.innerHTML=`<div class="hintbox"><b>Hint 2</b>：把注意力放在「${q.evidence.join('、')}」附近的線索。</div>`;else{box.innerHTML=`<div class="hintbox"><b>Hint 3</b>：正確依據已標黃，先用它排除不合理選項。</div>`;document.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('target',q.evidence.includes(x.dataset.e)));$('details').open=true}}
function check(){const q=current();const ev=state.evidence.length===q.evidence.length&&q.evidence.every(x=>state.evidence.includes(x));if(state.selected!==q.answer||!ev){state.revisions++;state.questionWrong++;beep(false);$('#feedback').className='feedback error';$('#feedback').innerHTML=`<strong>還沒解鎖。</strong> ${state.questionWrong===1?'重新比對題目與文本證據。':state.questionWrong===2?'再試一次；提示會縮小範圍。':'使用 Hint 3，先從標示線索重新判讀。'}`;manualHint();return}
 const d=qDigit(q);state.solved.push(q.number);state.digits.push(d);beep(true);document.querySelectorAll('[data-a],[data-e]').forEach(b=>b.disabled=true);$('#check').disabled=true;$('#hint').disabled=true;$('#feedback').className='feedback';$('#feedback').innerHTML=`<strong>✓ Correct! Answer + Evidence 都吻合。</strong>${esc(q.explanation)}<br>本題 Code Digit：<span class="digit">${d}</span><div class="actions"><button class="primary" id="next">${((state.index+1)%5===0||state.index===state.queue.length-1)?'前往 Room Lock →':'下一題 →'}</button></div>`;$('#next').onclick=()=>{if((state.index+1)%5===0||state.index===state.queue.length-1)roomLock();else{state.index++;question()}}}
function roomSlice(){const start=Math.floor(state.index/5)*5;return state.digits.slice(start,state.index+1)}
function roomLock(){const digits=roomSlice();const expected=digits.join('');const roomNo=Math.floor(state.index/5)+1;shell(`<section class="panel room-lock">${status()}<p class="kicker">ROOM ${roomNo} · CODE LOCK</p><h2>把本關取得的 Code Digits 依序輸入</h2><div class="code-row">${digits.map(()=>'<span class="code-chip">?</span>').join('')}</div><p class="muted">依本關題目出現順序輸入，不相加、不重排。</p><input class="lockinput" id="roomcode" inputmode="numeric" maxlength="${digits.length}" placeholder="${'0'.repeat(digits.length)}"><div class="actions" style="justify-content:center"><button class="primary" id="unlock">UNLOCK ROOM →</button></div><div id="feedback" class="feedback"></div></section>`);$('#unlock').onclick=()=>{if($('#roomcode').value!==expected){beep(false);$('#feedback').className='feedback error';$('#feedback').textContent='密碼不符。回想每題答對時得到的 Code Digit，依順序輸入。';return}const frag=(digits.reduce((a,b)=>a+b,0)+roomNo*3)%10;state.roomFragments.push(frag);beep(true);roomWon(roomNo,frag)}}
function roomWon(roomNo,frag){const last=state.index===state.queue.length-1;shell(`<section class="panel success">${status()}<p class="kicker">ROOM RESTORED</p><h2>Room ${roomNo} 修復成功！</h2><p>你取得最終修復碎片：</p><div class="code-row"><span class="code-chip">${frag}</span></div><p class="muted">Room Fragment 只用於最後的 Final Lock。</p><button class="primary" id="continue">${last?(state.roomFragments.length===1?'完成任務 →':'前往 FINAL LOCK →'):'進入下一個 Room →'}</button></section>`);$('#continue').onclick=()=>{if(last){if(state.roomFragments.length===1)win();else finalLock()}else{state.index++;question()}}}
function finalLock(){const expected=state.roomFragments.join('');shell(`<section class="panel room-lock"><p class="kicker">FINAL LOCK</p><h2>組合所有 Room Fragments</h2><p>依 Room 1 → Room ${state.roomFragments.length} 的順序輸入。</p><div class="code-row">${state.roomFragments.map(()=>'<span class="code-chip">?</span>').join('')}</div><input class="lockinput" id="finalcode" inputmode="numeric" maxlength="${state.roomFragments.length}" placeholder="${'0'.repeat(state.roomFragments.length)}"><div class="actions" style="justify-content:center"><button class="primary" id="final">RESTORE THE GAME →</button></div><div id="feedback" class="feedback"></div></section>`);$('#final').onclick=()=>{if($('#finalcode').value!==expected){beep(false);$('#feedback').className='feedback error';$('#feedback').textContent='Final Code 還沒吻合。確認 Room Fragment 的順序。';return}win()}}
function win(){state.ended=Date.now();beep(true);const sec=Math.floor((state.ended-state.started)/1000),time=`${Math.floor(sec/60)} 分 ${sec%60} 秒`;shell(`<section class="panel success"><div class="no-print"><p class="kicker">MISSION COMPLETE</p><h1>Game restored!</h1><p>你用答案與文本證據完成了任務。</p></div><div class="certificate"><p class="kicker">CERTIFICATE OF COMPLETION</p><h2>The Missing Game Code V3</h2><p style="font-size:28px;font-weight:800">${esc(state.team)}</p><p>${state.level==='beginner'?'Beginner A1–A2':'Advanced A2–B1'} · ${state.queue.length} Questions · ${state.mode==='guide'?'Guided':'Challenge'}</p><p>${new Date(state.ended).toLocaleDateString('zh-TW')}</p></div><div class="metrics"><span><strong>${state.solved.length}/${state.queue.length}</strong>完成題數</span><span><strong>${state.revisions}</strong>再思考次數</span><span><strong>${time}</strong>探索時間</span></div><div class="actions no-print" style="justify-content:center"><button class="primary" id="print">列印／另存 PDF 證書</button><button class="secondary" id="again">再挑戰一次</button></div><p class="muted no-print">Reflection：哪一段英文 evidence 最幫助你修正原本的答案？</p></section>`);$('#print').onclick=()=>window.print();$('#again').onclick=()=>restart(true)}
function restart(force=false){if(!force&&state.screen!=='home'&&state.queue.length&& !confirm('確定重新開始？目前進度會清除。'))return;const sound=state.sound,level=state.level,length=state.length,mode=state.mode;state={screen:'home',level,length,mode,team:'',queue:[],index:0,selected:null,evidence:[],solved:[],digits:[],roomFragments:[],wrong:0,revisions:0,started:0,ended:0,sound,questionWrong:0};home()}
$('#reset').onclick=()=>restart(false);$('#sound').onclick=()=>{state.sound=!state.sound;$('#sound').textContent='音效：'+(state.sound?'開':'關');if(state.sound)beep(true)};home();
</script>
</body></html>
